{% extends "core/base.html" %}
{% block title %}Reset password · UNILUS SGAMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <section class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4">Reset your password</h1>
                <p>Enter the email address on your account. If it is registered, we will send a reset link.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Send reset link</button>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
